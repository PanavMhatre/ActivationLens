name: Validate ActivationLens

on:
  push:
  pull_request:

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v
